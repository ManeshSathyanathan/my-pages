name: Daily Auto Commit

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 22f3000236@ds.study.iitm.ac.in
        run: |
          echo "Last run (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > daily-log.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-log.txt
          git commit -m "chore: daily automated update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
